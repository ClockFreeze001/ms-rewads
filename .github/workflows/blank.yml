name: Browser RDP Session

on:
  workflow_dispatch:

jobs:
  browser_rdp:
    runs-on: windows-latest
    steps:
      - name: Enable Remote Desktop
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Start Web Gateway
        run: |
          npm install meshcentral
          Start-Process -FilePath "npx" -ArgumentList "meshcentral --port 8080 --noagent"

      - name: Install Cloudflared
        run: |
          steps:
      - name: Download
      run: Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
      - name: Extract
      run: Expand-Archive ngrok.zip
      - name: Auth
      run: .\ngrok\ngrok.exe authtoken $Env:NGROK_AUTH_TOKEN
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      - name: Enable TS

      - name: Expose Browser Interface
        run: |
         - name: Create Tunnel
      run: .\ngrok\ngrok.exe tcp 8000
         
      - name: Keep Runner Active
        run: |
          Write-Host "Browser RDP Active. Check the Cloudflare step logs for your web link."
          Start-Sleep -Seconds 14400
