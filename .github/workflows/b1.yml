name: Linux Web Desktop (Webtop)

on:
  workflow_dispatch:

jobs:
  webtop_session:
    runs-on: ubuntu-latest
    steps:
      - name: Launch Webtop Container
        run: |
          docker run -d \
            --name=webtop \
            --security-opt seccomp=unconfined \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -p 3000:3000 \
            --shm-size="2gb" \
            lscr.io/linuxserver/webtop:ubuntu-xfce

      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Expose Web Desktop
        run: |
          cloudflared tunnel --url http://localhost:3000 &

      - name: Keep Runner Active
        run: |
          echo "Webtop active. View the link in the Expose Web Desktop step logs."
          sleep 21600 # Keeps job alive (up to 6 hours max execution time)
